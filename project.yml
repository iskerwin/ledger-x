name: Ledger
options:
  bundleIdPrefix: com.iskerwin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
packages:
  LedgerKit:
    path: LedgerKit
targets:
  Ledger:
    type: application
    platform: iOS
    sources:
      - path: Ledger
      - path: Shared
    dependencies:
      - package: LedgerKit
      - target: LedgerWidget
        embed: true
    entitlements:
      path: Ledger/Ledger.entitlements
      properties:
        com.apple.security.application-groups: [group.com.iskerwin.ledger]
    info:
      path: Ledger/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh_CN
        CFBundleLocalizations: [zh-Hans, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSFaceIDUsageDescription: 使用面容 ID 解锁账本
        NSCameraUsageDescription: 拍摄票据作为交易附件
        NSPhotoLibraryUsageDescription: 选择票据照片作为交易附件
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: com.iskerwin.ledger
            CFBundleURLSchemes: [ledgerx]
    settings:
      base:
        PRODUCT_NAME: Ledger
        PRODUCT_BUNDLE_IDENTIFIER: com.iskerwin.ledger
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ledger
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_PREVIEWS: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
  LedgerWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: LedgerWidget
      - path: Shared
    info:
      path: LedgerWidget/Info.plist
      properties:
        CFBundleDisplayName: Ledger
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: LedgerWidget/LedgerWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.iskerwin.ledger]
    settings:
      base:
        PRODUCT_NAME: LedgerWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.iskerwin.ledger.widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
schemes:
  Ledger:
    build:
      targets:
        Ledger: all
