name: Ledger runner
description: Shared validation, packaging and promotion steps; called by CI, Dev and Release.
inputs:
  cache_epoch:
    description: Cache generation resolved by the calling workflow.
    default: '1'
  check_only:
    description: Internal PR smoke check; load this action without running tests or publication.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Confirm shared action loads
      if: inputs.check_only == 'true'
      shell: bash
      run: echo 'Shared Ledger action loaded; no preparation, tests, build or publication executed.'
    - uses: actions/setup-python@v7
      if: inputs.check_only != 'true'
      with:
        python-version: '3.12'
    - name: Verify inputs, source and accepted package
      if: inputs.check_only != 'true'
      shell: bash
      run: python3 tools/cloud_worker.py prepare
    - name: Pin Xcode 26.6
      if: inputs.check_only != 'true'
      shell: bash
      run: bash tools/select_xcode.sh
    - name: Install build and report tools
      if: inputs.check_only != 'true'
      shell: bash
      run: |
        export HOMEBREW_NO_AUTO_UPDATE=1
        if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
        python3 -m pip install 'beancount==3.2.0'
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
    - name: Restore Swift package and test build cache
      if: inputs.check_only != 'true'
      uses: actions/cache@v6
      with:
        path: |
          ~/Library/Caches/org.swift.swiftpm
          ~/Library/org.swift.swiftpm
          LedgerKit/.build
          build-demo/SourcePackages
          build-demo/Build
        key: swift-xcode-26.6-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache_epoch }}-${{ hashFiles('LedgerKit/Package.swift', 'project.yml', 'tools/select_xcode.sh') }}-${{ hashFiles('Ledger/**', 'LedgerKit/**', 'LedgerTests/**', 'LedgerUITests/**') }}
        restore-keys: |
          swift-xcode-26.6-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache_epoch }}-${{ hashFiles('LedgerKit/Package.swift', 'project.yml', 'tools/select_xcode.sh') }}-
    - name: Validate, build or promote
      if: inputs.check_only != 'true'
      shell: bash
      run: python3 tools/cloud_worker.py run
    - name: Export screenshots
      if: inputs.check_only != 'true' && always()
      shell: bash
      run: |
        for result in interaction-tests*.xcresult; do
          if [ -d "$result" ]; then
            xcrun xcresulttool export attachments --path "$result" --output-path ".ship/screenshots/${result%.xcresult}"
          fi
        done
    - name: Keep reusable full validation
      if: inputs.check_only != 'true' && success() && hashFiles('.ship/full-validation.json') != ''
      uses: actions/upload-artifact@v7
      with:
        name: 'ledger-full-proof-${{ github.run_id }}'
        include-hidden-files: true
        retention-days: 30
        if-no-files-found: error
        path: .ship/full-validation.json
    - name: Keep evidence, logs and package
      if: inputs.check_only != 'true' && always()
      uses: actions/upload-artifact@v7
      with:
        name: 'ledger-${{ env.LEDGER_COMMAND }}-${{ github.run_id }}'
        include-hidden-files: true
        retention-days: 7
        if-no-files-found: warn
        path: |
          .ship/status.json
          .ship/full-validation.json
          .ship/selected-validation.json
          .ship/dev-test-plan.json
          .ship/screenshots/
          *-tests.log
          reports-check.log
          demo-build.log
          build.log
          interaction-tests*.xcresult/
          dist/*.json
          dist/*.md
          dist/*.ipa
