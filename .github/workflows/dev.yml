name: Ledger Dev
run-name: 'Dev · ${{ inputs.full && ''全量测试'' || ''指定测试'' }} · ${{ github.ref_name }}'
on:
  workflow_dispatch:
    inputs:
      full:
        description: '全量测试后发布：不确定相关测试时勾选；勾选后下面两个测试筛选留空'
        type: boolean
        default: false
      core_filter:
        description: '相关核心测试：例 CalendarMarkTests；未勾全量时，必须填写这里或下面的用例'
        default: ''
      ui_tests:
        description: '相关 App/界面测试：Target/Class[/method]，多个用空格分隔；例 LedgerTests/AppearanceTests'
        default: ''
      device:
        description: '机型（可选）：留空自动选择；窄屏填 iPhone SE (3rd generation)'
        default: ''
      source_sha:
        description: '无需填写：留空自动发布 main 当前提交；命令行自动填写以锁定源码'
        default: ''
permissions:
  contents: read
# Dev 和 Release 共用发布锁。正在发布的不取消；排队只保留最新一次。
concurrency:
  group: ledger-publication
  cancel-in-progress: false
jobs:
  refuse:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse publication off main
        run: |
          echo 'Dev 只能发布 main：Run workflow 的 Branch 请选择 main'
          exit 1
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 180
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      LEDGER_COMMAND: dev
      LEDGER_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      LEDGER_FULL: ${{ inputs.full }}
      LEDGER_CORE_FILTER: ${{ inputs.core_filter }}
      LEDGER_UI_TESTS: ${{ inputs.ui_tests }}
      LEDGER_SIMULATOR_DEVICE: ${{ inputs.device }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/ledger-run
