name: Ledger PR
run-name: 'PR #${{ github.event.pull_request.number }}'
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
# 同一个 PR 只保留最新一次检查。这里不发布，取消旧检查没有副作用。
concurrency:
  group: 'ledger-pr-${{ github.event.pull_request.number }}'
  cancel-in-progress: true
jobs:
  gate:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Pin Xcode 26.6
        run: bash tools/select_xcode.sh
      - name: Install build and report tools
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          python3 -m pip install 'beancount==3.2.0'
      - name: Checks for this pull request
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/pr_gate.py
