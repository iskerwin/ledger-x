name: Demo download and iOS validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out the demo snapshot used by integration tests
        uses: actions/checkout@v4
        with:
          repository: iskerwin/ledger-demo
          ref: 4ffdc0337165ea61f031a3a720d9d05edb85f44a
          path: .demo-data
      - name: Select the same current Xcode as the release workflow
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -E 'Xcode_[0-9.]+\.app$' | sort -V | tail -1)"
          xcodebuild -version
      - name: Test LedgerKit and demo installation
        env:
          LEDGER_DEMO_PATH: ${{ github.workspace }}/.demo-data
        run: swift test --package-path LedgerKit
      - name: Compile the iOS app without bundled demo data
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Ledger.xcodeproj -scheme Ledger -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-demo CODE_SIGNING_ALLOWED=NO build > demo-build.log 2>&1 \
            || { grep -E "error:" demo-build.log | sort -u | head -20 | while IFS= read -r l; do echo "::error::${l:0:400}"; done; tail -100 demo-build.log; exit 1; }
